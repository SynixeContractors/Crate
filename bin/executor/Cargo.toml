[package]
name = "synixe-executor"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
bootstrap = { path = "../../lib/bootstrap", features = ["async-nats"] }
synixe-events = { path = "../../lib/events" }
synixe-meta = { path = "../../lib/meta" }
synixe-proc = { path = "../../lib/proc" }
synixe-model = { path = "../../lib/model" }

anyhow = { workspace = true }
async-trait = { workspace = true }
async-nats =  { workspace = true }
reqwest = { workspace = true }
serenity = { workspace = true, features = ["builder"] }
time = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
tokio-simple-scheduler = "0.2.0"
tracing = { workspace = true }

# recruiting
# roux = "2.2.15"
roux = { git = "https://github.com/synixecontractors/roux" }
rust-embed = "8.12.0"
scraper = "0.27.0"
